# VFRS Configuration for Dynamips Cisco 3660 SVC Interop Testing
swconfig swid=SW_DYNAMIPS dnic=5104 sgclen=2 sgc=01 siclen=2 sic=01 subnumlen=4
log_level con=info txt=debug
log_file test_dynamips.log

# Port uni0/0 connected to Dynamips R1 (Serial1/0 on UDP 10001 -> 10000)
port uni0/0 udp 127.0.0.1 10000 127.0.0.1 10001 pcap=uni0_0_dynamips.pcap

# Port uni0/1 connected to Dynamips R2 (Serial1/0 on UDP 20001 -> 20000)
port uni0/1 udp 127.0.0.1 20000 127.0.0.1 20001 pcap=uni0_1_dynamips.pcap

# Q.933A LMI on both ports
lmi uni0/0 type=q933a
lmi uni0/1 type=q933a

# Enable SVC on both ports
svc_int uni0/0 dlci_low=512 dlci_high=991
svc_int uni0/1 dlci_low=512 dlci_high=991

# Assign subscribers matching Cisco IOS map-list (R1: 1000, R2: 1001)
svc_addr uni0/0 DGE1000 alias=1000
svc_addr uni0/1 DGE1001 alias=1001
