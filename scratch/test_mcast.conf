swconfig swid=vfrs_test dnic=1000
log_level con=debug txt=debug
log_file test_mcast.log

port uni0/0 udp 127.0.0.1 10001 127.0.0.1 20001
port uni0/1 udp 127.0.0.1 10002 127.0.0.1 20002
port uni0/2 udp 127.0.0.1 10003 127.0.0.1 20003

# One-way multicast group: uni0/0 DLCI 100 -> uni0/1 DLCI 201, uni0/2 DLCI 202
mcast broadcast1 uni0/0 100 oneway
mcast_member broadcast1 uni0/1 201
mcast_member broadcast1 uni0/2 202

# Two-way multicast group: uni0/0 DLCI 500 -> uni0/1 DLCI 601, uni0/2 DLCI 602
mcast twoway1 uni0/0 500 twoway
mcast_member twoway1 uni0/1 601
mcast_member twoway1 uni0/2 602

# N-way multicast group: uni0/0 DLCI 800, uni0/1 DLCI 801, uni0/2 DLCI 802
mcast nway1 uni0/0 800 nway
mcast_member nway1 uni0/1 801
mcast_member nway1 uni0/2 802
