# ==============================================================================
# VFRS Modern Configuration Specification & Architectural Guide
# Virtual Frame Relay Switch (VFRS) - ITU-T Q.922 / Q.933 / X.36 / X.76 / FRF
# ==============================================================================
#
# DOKUMENTASI LENGKAP STRUKTUR TATA BAHASA & REFERENSI PARAMETER
#
# ------------------------------------------------------------------------------
# 1. KONVENSI PENAMAAN PORT & ANTARMUKA
# ------------------------------------------------------------------------------
# Format penamaan port mengikuti pola kelompok/indeks terstruktur:
#   uni<X>/<Y>  : Antarmuka UNI (User-to-Network Interface, X.36).
#                 VFRS bertindak sebagai DCE (jaringan) yang melayani DTE pelanggan.
#   nni<X>/<Y>  : Antarmuka NNI (Network-to-Network Interface, X.76).
#                 VFRS bertindak sebagai STE (Signaling Terminal Equipment)
#                 simetris untuk interkoneksi antar-switch Frame Relay.
#   X           : Nomor kelompok port/antarmuka (0 - 255).
#   Y           : Nomor indeks port/antarmuka dalam kelompok (0 - 255).
#   Kapasitas   : 65.536 port per tipe antarmuka (total 131.072 port).
#
# ------------------------------------------------------------------------------
# 2. ATURAN LEKSER & FORMAT TOKENISASI
# ------------------------------------------------------------------------------
#   - Komentar            : Ditandai dengan karakter '#' hingga akhir baris.
#   - Sambungan Baris     : Karakter '\' di akhir baris menyambung pernyataan
#                           panjang ke baris berikutnya secara mulus.
#   - String Berpetik     : Petik ganda ("...") digunakan untuk jalur direktori,
#                           nama file, atau teks yang memiliki spasi.
#   - Unit Kecepatan Data : bps (bit/detik), k/K (x1.000), m/M (x1.000.000),
#                           g/G (x1.000.000.000). Contoh: 64000, 64k, 2M, 10M, 1G.
#   - Unit Waktu / Durasi : s/sec (detik), ms (milidetik).
#                           Mendukung desimal: 0.5s (500ms), 1.5s (1500ms), 10s.
#   - Nilai Boolean       : allow / deny, enable / disable, true / false, 1 / 0.
#
# ==============================================================================
# 3. KONFIGURASI DASAR SWITCH/INSTANCE (swconfig)
# ==============================================================================
# Menentukan identitas switch dan rencana penomoran internasional utama.
#
# Sintaks X.121:
#   swconfig swid=<string> nspf=x121 {dcc=<nnn> [nd={<n> | none}] | dnic=<nnnn>} \
#            [pnic={<number> | none}] [ind=<number>] sgclen={<n> | none} [sgc=<number>] \
#            siclen={<n> | none} [sic=<number>] [sublen=<n>]
#
# Sintaks E.164:
#   swconfig swid=<string> nspf=e164 cc=<number> {[ic=<number>] | [ndc=<number> [area=<number>]]} \
#            [ind=<number>] sgclen={<n> | none} [sgc=<number>] siclen={<n> | none} [sic=<number>] \
#            [sublen=<n>]
#
# Parameter swconfig:
#   swid    : String identifikasi instance switch (maks 32 karakter, default: vfrs0).
#   nspf    : Format penomoran utama: 'x121' (ITU-T X.121) atau 'e164' (ITU-T E.164).
#
# Parameter Rencana Penomoran X.121 (Maks 14 Digit):
#   dcc     : Data Country Code (3 digit angka, misal 510 untuk Indonesia).
#   nd      : Network Digit (1 digit angka 0-9, atau 'none').
#   dnic    : Data Network Identification Code (4 digit, gabungan DCC + ND).
#             Jika dnic ditentukan, nilainya menggantikan dcc dan nd.
#   pnic    : Private Network Identification Code (opsional, hingga 6 digit).
#   ind     : Internal Network Digits (panjang tak terbatas / bebas batas,
#             digunakan untuk partisi internal operator/jaringan).
#   sgclen  : Panjang digit Kode Kelompok Sistem / System Group Code (1-4 atau none).
#   sgc     : Nilai System Group Code instance ini (otomatis zero-padded sesuai sgclen).
#   siclen  : Panjang digit Kode Identifikasi Sistem / System ID Code (1-4 atau none).
#   sic     : Nilai System ID Code instance ini (otomatis zero-padded sesuai siclen).
#   sublen  : Panjang nomor terminal pelanggan yang akan dialokasikan secara
#             otomatis oleh VFRS. Default dihitung otomatis:
#             14 - (panjang DCC + ND/DNIC + PNIC + IND + SGC + SIC).
#
# Parameter Rencana Penomoran E.164 (Maks 15 Digit):
#   cc      : Country Code (1-3 digit, misal 62 untuk Indonesia).
#   ic      : International Network Identification Code (1-4 digit).
#   ndc     : National Destination Code (kode tujuan nasional).
#   area    : Kode area geografis lokal / regional.
#   sublen  : Panjang nomor pelanggan otomatis (default: 15 - panjang prefix).

swconfig swid=vfrs0 nspf=x121 dnic=5104 sgclen=2 sgc=01 siclen=2 sic=01 sublen=4

# ==============================================================================
# 4. SUBSISTEM LOGGING & ROTASI BERKAS LOG (log)
# ==============================================================================
# Mengontrol level diagnostik konsol, penulisan log berkas, dan rotasi otomatis.
#
# Sintaks:
#   log level con={trace | debug | info | warn | error} txt={trace | debug | info | warn | error}
#   log file <path-berkas>
#   log rotation size=<megabytes> files=<jumlah-arsip>
#
# Parameter:
#   con   : Level verbositas log untuk terminal konsol (default: info).
#   txt   : Level verbositas log untuk berkas teks log (default: info).
#   file  : Lokasi penyimpanan berkas log (default: vfrs.log).
#   size  : Ukuran maksimum tiap berkas log sebelum rotasi dalam Megabytes (default: 10 MB).
#   files : Jumlah berkas log arsip rotasi yang disimpan (default: 5).

log level con=info txt=debug
log rotation size=10 files=5
# log file "logs/vfrs.log"

# ==============================================================================
# 5. KASKADE NILAI DEFAULT MULTI-TIER (Scoped Defaults Cascade)
# ==============================================================================
# Menentukan nilai default warisan yang secara otomatis diwariskan ke port, PVC,
# dan SVC jika tidak didefinisikan secara eksplisit per baris antarmuka.
#
# Sintaks:
#   default interface dlcibit={10 | 23} ar=<bps>
#   default lapf k=<n> n200=<n> n201=<n> t200=<s> t203=<s>
#   default lmi-dce n392=<n> n393=<n> t392=<s>
#   default lmi-dte n391=<n> n392=<n> n393=<n> t391=<s>
#   default pvc cir=<bps> bc=<bits> be=<bits> ftp=<0-15> fdp=<0-7> class=<0-3>
#   default svc cir=<bps> bc=<bits> be=<bits> fmif=<octets> ftp=<0-15> fdp=<0-7> class=<0-3> \
#               revchg={allow | deny}
#   default svc uni t303=<s> t305=<s> t308=<s> t310=<s> t301=<s> t316=<s> t317=<s> t322=<s>
#   default svc nni t303=<s> t305=<s> t308=<s> t310=<s> t301=<s> t316=<s> t317=<s> t322=<s>

default interface dlcibit=10 ar=64000
default lapf k=8 n200=3 n201=260 t200=2s t203=30s
default lmi-dce n392=3 n393=4 t392=15s
default lmi-dte n391=6 n392=3 n393=4 t391=10s
default pvc cir=32000 bc=32000 be=0 ftp=8 fdp=4 class=1
default svc cir=32000 bc=32000 be=0 fmif=1600 ftp=8 fdp=4 class=1 revchg=allow

# ==============================================================================
# 6. DEFINISI PORT & DRIVER TRANSPORT (port)
# ==============================================================================
# Mengonfigurasi antarmuka fisik dan kanal komunikasi transport endpoint.
#
# Sintaks Pilihan Driver Transport:
#   port <nama> udp <local-ip> <local-port> <remote-ip> <remote-port> [dlcibit={10|23}] [ar=<bps>]
#   port <nama> udp-client <remote-ip> <remote-port> [dlcibit={10|23}] [ar=<bps>]
#   port <nama> udp-server [<bind-ip>] <local-port> [dlcibit={10|23}] [ar=<bps>]
#   port <nama> tcp <local-ip> <local-port> <remote-ip> <remote-port> [dlcibit={10|23}] [ar=<bps>]
#   port <nama> tcp-client <remote-ip> <remote-port> [dlcibit={10|23}] [ar=<bps>]
#   port <nama> tcp-server [<bind-ip>] <local-port> [dlcibit={10|23}] [ar=<bps>]
#   port <nama> {pipe-client | pipe-server} <pipe-name> [dlcibit={10|23}] [ar=<bps>]
#   port <nama> serial <serial-device> [baud=<number>] [dlcibit={10|23}] [ar=<bps>]
#   port <nama> {l2tpv3fr | l2tpv3hdlc} [<local-ip>] <remote-ip> <vcid> [dlcibit={10|23}] [ar=<bps>]

port uni0/0 udp 127.0.0.1 10000 127.0.0.1 10001
port uni0/1 udp 127.0.0.1 10002 127.0.0.1 10003
port uni0/2 udp 127.0.0.1 10004 127.0.0.1 10005
port uni0/3 udp 127.0.0.1 10006 127.0.0.1 10007

# ==============================================================================
# 7. PERMANENT VIRTUAL CIRCUITS (pvc & pvc mcast)
# ==============================================================================
# Mengonfigurasi rute pensaklaran sirkuit virtual permanen point-to-point & multicast.
#
# Sintaks:
#   pvc <port1> <dlci1> <port2> <dlci2> [cir=<bps>] [bc=<bits>] [be=<bits>] \
#       [ftp=<0-15>] [fdp=<0-7>] [class=<0-3>]
#
#   pvc mcast <nama-grup> [cir=<bps>] [bc=<bits>] [be=<bits>] [ftp=<0-15>] [fdp=<0-7>] [class=<0-3>]
#   pvc mcast group <nama-grup> <source-port> <source-dlci> [oneway | twoway | nway]
#   pvc mcast member <nama-grup> <member-port> <member-dlci> [cir=<bps>] [bc=<bits>] [be=<bits>]

pvc uni0/0 100 uni0/1 200 cir=64000
pvc uni0/0 101 uni0/1 201 cir=32000
pvc uni0/0 102 uni0/2 300 cir=32000

# ==============================================================================
# 8. LOCAL MANAGEMENT INTERFACE (lmi)
# ==============================================================================
# Mengaktifkan protokol manajemen lokal LMI pada antarmuka (DCE maupun DTE).
#
# Sintaks:
#   lmi <port> [dce] [ansi | cisco | none | q933a] [t392=<s>] [n392=<n>] [n393=<n>]
#   lmi <port> dte [ansi | cisco | q933a] [t391=<s>] [n391=<n>] [n392=<n>] [n393=<n>]

lmi uni0/0 dce q933a t392=15s n392=3 n393=4
lmi uni0/1 dce q933a t392=15s n392=3 n393=4
lmi uni0/2 dce q933a t392=15s n392=3 n393=4
lmi uni0/3 dce q933a t392=15s n392=3 n393=4

# ==============================================================================
# 9. PROTOKOL LAPF DATA LINK LAYER (lapf)
# ==============================================================================
# Mengonfigurasi parameter LAPF Link Layer (Q.922 Core) per antarmuka.
#
# Sintaks:
#   lapf <port> [k=<n>] [n200=<n>] [n201=<n>] [t200=<s>] [t203=<s>]

lapf uni0/0 k=8 n200=3 n201=260 t200=2s t203=30s
lapf uni0/1 k=8 n200=3 n201=260 t200=2s t203=30s
lapf uni0/2 k=8 n200=3 n201=260 t200=2s t203=30s
lapf uni0/3 k=8 n200=3 n201=260 t200=2s t203=30s

# ==============================================================================
# 10. SWITCHED VIRTUAL CIRCUITS (svc)
# ==============================================================================
# Mengonfigurasi antarmuka persinyalan Q.933 SVC, registrasi penomoran pelanggan,
# dan tabel perutean panggilan (call routing radix trie).
#
# 10.1 Konfigurasi Antarmuka SVC (svc int):
#   svc int <port> [dlci_low=<n>] [dlci_high=<n>] [cirdef=<bps>] [bcdef=<bits>] \
#                  [bedef=<bits>] [fmifdef=<octets>] [ftpdef=<0-15>] [fdpdef=<0-7>] \
#                  [clsdef=<0-3>] [revchg={allow | deny}]

svc int uni0/0 dlci_low=512 dlci_high=991 revchg=allow
svc int uni0/1 dlci_low=512 dlci_high=991 revchg=allow
svc int uni0/2 dlci_low=512 dlci_high=991 revchg=allow
svc int uni0/3 dlci_low=512 dlci_high=991 revchg=allow

# 10.2 Registrasi Nomor Pelanggan (svc addr):
#   - manual     : Nomor penuh ditentukan secara eksplisit.
#   - autoprefix : Nomor terminal lokal otomatis digabung dengan prefix switch.
#   - autonumber : Nomor terminal otomatis diberikan secara berurutan sesuai urutan port.
#   - alias      : Mendukung alias nomor alternatif (misal alias E.164 untuk nomor X.121).

svc addr uni0/0 manual x121 510401010001 alias e164 628110001
svc addr uni0/1 manual x121 510401010002
svc addr uni0/2 autoprefix x121 0003 alias e164 628110003
svc addr uni0/3 autoprefix x121 0004

# 10.3 Tabel Perutean Panggilan SVC (svc route):
#   Mendukung perutean prefix terstruktur X.121, E.164, dan regex prefix.
#   Pencarian rute menggunakan 10-way Radix Tree dengan Longest-Prefix Matching.
#
# Sintaks:
#   svc route <port> prefix {x121 | e164} <prefix-regex> [revchg={allow | deny}]
#   svc route <port> x121 dnic=<nnnn> [sgc=<sgc>] [sic=<sic>] [revchg={allow | deny}]
#   svc route <port> e164 cc=<cc> [ndc=<ndc>] [area=<area>] [revchg={allow | deny}]

# Contoh perutean panggilan keluar ke port NNI:
# svc route nni0/0 x121 dnic=5104 sgc=02
# svc route nni0/1 e164 cc=60

# ==============================================================================
# 11. MANAJEMEN KONGESTI & CAPTURE PCAP (cgst & capture)
# ==============================================================================
#   cgst <port> rate=<fps> [clear=<fps>] [threshold=<number>] [cllm={enable | disable} [txint=<s>]]
#   capture {<port> | <group> | global | all} <path-pcap> [svccap={iframe | uiframe}]

cgst uni0/0 rate=1000 cllm=enable txint=5s
cgst uni0/1 rate=1000 cllm=enable txint=5s
cgst uni0/2 rate=1000 cllm=enable txint=5s
cgst uni0/3 rate=1000 cllm=enable txint=5s
