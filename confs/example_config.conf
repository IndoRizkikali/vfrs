# ==============================================================================
# vfr_switch - Panduan Lengkap & Contoh Berkas Konfigurasi Modern
# Virtual Frame Relay Switch (VFRS) - ITU-T Q.922 / Q.933 / X.36 / X.76
# ==============================================================================
#
# Ketentuan Penamaan Antarmuka (Interface Naming Convention):
#   uni<X>/<Y>  Antarmuka UNI (User-to-Network Interface, ITU-T X.36)
#               VFRS bertindak sebagai DCE (jaringan) pada antarmuka ini.
#   nni<X>/<Y>  Antarmuka NNI (Network-to-Network Interface, ITU-T X.76)
#               VFRS bertindak sebagai STE (Signaling Terminal Equipment)
#               simetris pada antarmuka ini.
#   X = Nomor kelompok port/antarmuka (0 - 255)
#   Y = Nomor indeks port/antarmuka dalam kelompok (0 - 255)
#   Contoh: uni0/0, uni0/1, nni0/0, nni0/1
#
# Aturan Tata Bahasa Konfigurasi (Grammar Rules):
#   1. Komentar: Diawali karakter '#' hingga akhir baris. Komentar dapat
#      berdiri sendiri atau diletakkan di ujung baris pernyataan.
#   2. Sambungan Baris (Line Continuation): Baris yang diakhiri karakter '\'
#      akan disambung secara mulus dengan baris berikutnya.
#   3. String Berpetik: Nilai berpetik ganda ("...") digunakan untuk jalur berkas
#      atau nama yang mengandung spasi atau karakter khusus.
#   4. Format Nilai & Unit:
#      - Kecepatan data (Data Rate): 'bps', 'k'/'K' (1.000), 'm'/'M' (1.000.000).
#        Contoh: 64000, 64k, 2M, 10M, 100M.
#      - Waktu/Durasi (Time Duration): 's'/'sec' (detik), 'ms' (milidetik).
#        Mendukung nilai desimal, contoh: 1.5s, 500ms, 10s, 15s.
#      - Nilai Boolean: 'allow'/'deny', 'enable'/'disable', 'true'/'false', 1/0.
#
# ==============================================================================
# 1. KONFIGURASI DASAR SWITCH/INSTANCE VFRS (swconfig)
# ==============================================================================
# Mengatur parameter identitas dan rencana penomoran internasional (Dial Plan)
# yang menjadi acuan pengalamatan SVC dan perutean multi-tier.
#
# Sintaks X.121:
#   swconfig swid=<string> nspf=x121 {dcc=<nnn> [nd={<n>|none}] | dnic=<nnnn>} \
#            [pnic={<number>|none}] [ind=<number>] sgclen={<n>|none} [sgc=<number>] \
#            siclen={<n>|none} [sic=<number>] [sublen=<n>]
#
# Sintaks E.164:
#   swconfig swid=<string> nspf=e164 cc=<number> {[ic=<number>] | [ndc=<number> [area=<number>]]} \
#            [ind=<number>] sgclen={<n>|none} [sgc=<number>] siclen={<n>|none} [sic=<number>] \
#            [sublen=<n>]
#
# Penjelasan Parameter:
#   swid:   String pengenal instance switch dalam log & CLI (maks 32 karakter).
#   nspf:   Numbering Plan Identification (x121 atau e164).
#
#   -- Parameter Khusus X.121 (ITU-T X.121, Maks 14 Digit) --
#   dcc:    Data Country Code (3 digit angka, contoh: 510 untuk Indonesia).
#   nd:     National Digit / Network Digit (1 digit, 0-9, atau 'none').
#   dnic:   Data Network Identification Code (4 digit, gabungan DCC + ND).
#   pnic:   Private Data Network Identification Code (opsional, maks 6 digit).
#   ind:    Internal Network Digits (panjang fleksibel, untuk partisi internal).
#   sgclen: Panjang digit Kode Kelompok Sistem / System Group Code (1-4 atau none).
#   sgc:    Nilai System Group Code switch ini (otomatis zero-padded sesuai sgclen).
#   siclen: Panjang digit Kode Identifikasi Sistem / System ID Code (1-4 atau none).
#   sic:    Nilai System ID Code switch ini (otomatis zero-padded sesuai siclen).
#   sublen: Panjang digit nomor pelanggan (default: sisa ruang hingga 14 digit).
#
#   -- Parameter Khusus E.164 (ITU-T E.164, Maks 15 Digit) --
#   cc:     Country Code (1-3 digit, contoh: 62).
#   ic:     International Network Identification Code (1-4 digit).
#   ndc:    National Destination Code (kode tujuan nasional).
#   area:   Kode area regional / lokal.

swconfig swid=vfrsA nspf=x121 dnic=5104 sgclen=2 sgc=01 siclen=2 sic=01 sublen=4

# ==============================================================================
# 2. SUBSISTEM LOGGING & ROTASI (log)
# ==============================================================================
# Mengontrol level diagnostik konsol, penulisan log berkas, dan rotasi otomatis.
#
# Sintaks:
#   log level con={trace | debug | info | warn | error} txt={trace | debug | info | warn | error}
#   log file <path-berkas>
#   log rotation size=<megabytes> files=<jumlah-arsip>

log level con=info txt=debug
log rotation size=10 files=5
# log file "logs/vfrsA.log"

# ==============================================================================
# 3. KASKADE NILAI DEFAULT MULTI-TIER (Scoped Defaults Cascade)
# ==============================================================================
# Menentukan nilai default yang secara otomatis diwariskan ke port, PVC, dan SVC
# jika tidak didefinisikan secara eksplisit per baris antarmuka.
#
# - default interface dlcibit={10 | 23} ar=<bps>
#     dlcibit : Mode penomoran DLCI (10-bit standar maks 1023, 23-bit extended maks 8388607).
#     ar      : Access Rate fisik antarmuka (bps / k / M).
#
# - default lapf k=<n> n200=<n> n201=<n> t200=<s> t203=<s>
#     k       : Ukuran jendela transmisi frame LAPF (1-127).
#     n200    : Maksimum pengulangan transmisi sebelum link reset.
#     n201    : Ukuran maksimum payload LAPF Information Frame (oktet).
#     t200    : Timer retransmisi acknowledged I-frame.
#     t203    : Timer keepalive / idle link verification.
#
# - default lmi-dce n392=<n> n393=<n> t392=<s>
#     n392    : Ambang batas error (error threshold) pada sisi jaringan (DCE).
#     n393    : Rentang jendela pemantauan kejadian error (monitored events).
#     t392    : Timer interval polling DCE (default: 15s).
#
# - default lmi-dte n391=<n> n392=<n> n393=<n> t391=<s>
#     n391    : Penghitung siklus Full Status Enquiry (default: 6).
#     t391    : Timer polling berkala DTE (default: 10s).
#
# - default pvc cir=<bps> bc=<bits> be=<bits> ftp=<0-15> fdp=<0-7> class=<0-3>
#     cir     : Committed Information Rate (kecepatan informasi terjamin).
#     bc      : Committed Burst Size (ukuran burst terjamin).
#     be      : Excess Burst Size (ukuran burst berlebih).
#     ftp     : Frame Transfer Priority (prioritas transmisi, 0-15).
#     fdp     : Frame Discard Priority (prioritas pembuangan saat kongesti, 0-7).
#     class   : Service Class (0=Standard, 1=Premium, 2=Real-Time, 3=Mission-Critical).
#
# - default svc cir=<bps> bc=<bits> be=<bits> fmif=<octets> ftp=<0-15> fdp=<0-7> class=<0-3> revchg={allow | deny}
# - default svc uni / nni t303=<s> t305=<s> t308=<s> t310=<s> t301=<s> t316=<s> t317=<s> t322=<s>
#     Timer persinyalan SVC sesuai rekomendasi ITU-T Q.933 / X.36 / X.76.

default interface dlcibit=10 ar=64000
default lapf k=8 n200=3 n201=260 t200=2s t203=30s
default lmi-dce n392=3 n393=4 t392=15s
default lmi-dte n391=6 n392=3 n393=4 t391=10s
default pvc cir=32000 bc=32000 be=0 ftp=8 fdp=4 class=1
default svc cir=32000 bc=32000 be=0 fmif=1600 ftp=8 fdp=4 class=1 revchg=allow

# ==============================================================================
# 4. DEFINISI PORT & DRIVER TRANSPORT (port)
# ==============================================================================
# Mengonfigurasi antarmuka fisik dan kanal komunikasi transport endpoint.
#
# Pilihan Transport:
#   - UDP Socket          : port <nama> udp <local-ip> <local-port> <remote-ip> <remote-port>
#   - UDP Client / Server : port <nama> udp-client <remote-ip> <remote-port>
#                           port <nama> udp-server [<bind-ip>] <local-port>
#   - TCP Socket          : port <nama> tcp <local-ip> <local-port> <remote-ip> <remote-port>
#   - TCP Client / Server : port <nama> tcp-client <remote-ip> <remote-port>
#                           port <nama> tcp-server [<bind-ip>] <local-port>
#   - Named Pipe (IPC)    : port <nama> {pipe-client | pipe-server} <pipe-name>
#   - Serial Port         : port <nama> serial <dev-path> [baud=<rate>]
#   - L2TPv3 Tunnel       : port <nama> {l2tpv3fr | l2tpv3hdlc} [<local-ip>] <remote-ip> <vcid>

port uni0/0 udp 127.0.0.1 10000 127.0.0.1 10001
port uni0/1 udp 127.0.0.1 10002 127.0.0.1 10003
port uni0/2 udp 127.0.0.1 10004 127.0.0.1 10005
port uni0/3 udp 127.0.0.1 10006 127.0.0.1 10007

# ==============================================================================
# 5. PERMANENT VIRTUAL CIRCUITS (pvc & pvc mcast)
# ==============================================================================
# Mengonfigurasi rute pensaklaran sirkuit virtual permanen point-to-point & multicast.
#
# Sintaks:
#   pvc <port1> <dlci1> <port2> <dlci2> [cir=<bps>] [bc=<bits>] [be=<bits>] \
#       [ftp=<0-15>] [fdp=<0-7>] [class=<0-3>]

pvc uni0/0 100 uni0/1 200 cir=64000
pvc uni0/0 101 uni0/1 201 cir=32000
pvc uni0/0 102 uni0/2 300 cir=32000

# ==============================================================================
# 6. LOCAL MANAGEMENT INTERFACE (lmi)
# ==============================================================================
# Mengaktifkan protokol manajemen lokal LMI pada antarmuka (DCE maupun DTE).
#
# Sintaks:
#   lmi <port> [dce] [ansi | cisco | none | q933a] [t392=<s>] [n392=<n>] [n393=<n>]
#   lmi <port> dte [ansi | cisco | q933a] [t391=<s>] [n391=<n>] [n392=<n>] [n393=<n>]

lmi uni0/0 dce q933a t392=15s n392=3 n393=4
lmi uni0/1 dce q933a t392=15s n392=3 n393=4
lmi uni0/2 dce q933a t392=15s n392=3 n393=4
lmi uni0/3 dce q933a t392=15s n392=3 n393=4

# ==============================================================================
# 7. PROTOKOL LAPF DATA LINK LAYER (lapf)
# ==============================================================================
# Mengonfigurasi parameter LAPF Link Layer (Q.922) per antarmuka.
#
# Sintaks:
#   lapf <port> [k=<n>] [n200=<n>] [n201=<n>] [t200=<s>] [t203=<s>]

lapf uni0/0 k=8 n200=3 n201=260 t200=2s t203=30s
lapf uni0/1 k=8 n200=3 n201=260 t200=2s t203=30s
lapf uni0/2 k=8 n200=3 n201=260 t200=2s t203=30s
lapf uni0/3 k=8 n200=3 n201=260 t200=2s t203=30s

# ==============================================================================
# 8. SWITCHED VIRTUAL CIRCUITS (svc)
# ==============================================================================
# Mengaktifkan antarmuka persinyalan Q.933 SVC, registrasi nomor pelanggan,
# dan aturan perutean panggilan (call routing table & digit radix trie).
#
# 8.1 Antarmuka SVC (svc int):
#   svc int <port> [dlci_low=<n>] [dlci_high=<n>] [cirdef=<bps>] [bcdef=<bits>] \
#                  [bedef=<bits>] [fmifdef=<octets>] [ftpdef=<0-15>] [fdpdef=<0-7>] \
#                  [clsdef=<0-3>] [revchg={allow | deny}]

svc int uni0/0 dlci_low=512 dlci_high=991 revchg=allow
svc int uni0/1 dlci_low=512 dlci_high=991 revchg=allow
svc int uni0/2 dlci_low=512 dlci_high=991 revchg=allow
svc int uni0/3 dlci_low=512 dlci_high=991 revchg=allow

# 8.2 Registrasi Nomor Pelanggan (svc addr):
#   - manual     : Nomor penuh ditentukan secara eksplisit.
#   - autoprefix : Nomor terminal lokal digabung otomatis dengan prefix jaringan switch.
#   - autonumber : Penomoran otomatis berurutan sesuai indeks port dalam sistem.
#   Dapat menyertakan alias nomor alternatif (misal alias E.164 untuk nomor X.121).

svc addr uni0/0 manual x121 510401010001 alias e164 628110001
svc addr uni0/1 manual x121 510401010002
svc addr uni0/2 autoprefix x121 0003 alias e164 628110003
svc addr uni0/3 autoprefix x121 0004

# 8.3 Tabel Perutean Panggilan SVC (svc route):
#   Mendukung perutean berbasis prefix string, perutean terstruktur X.121
#   (DNIC / SGC / SIC), dan perutean terstruktur E.164 (CC / NDC / Area).
#
# Sintaks:
#   svc route <port> prefix {x121 | e164} <prefix-digits>
#   svc route <port> x121 dnic=<nnnn> [sgc=<sgc>] [sic=<sic>]
#   svc route <port> e164 cc=<cc> [ndc=<ndc>] [area=<area>]

# Contoh rute SVC ke antarmuka NNI atau gateway eksternal:
# svc route nni0/0 x121 dnic=5104 sgc=02
# svc route nni0/1 e164 cc=60
