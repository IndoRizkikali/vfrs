swconfig swid=<string> nspf=x121 {dcc=<nnn> [nd={<n> | none}] | dnic=<nnnn>} [pnic={<number> | none}] [ind=<number>] sgclen={<n> | none} [sgc=<number>] siclen={<n> | none} [sic=<number>]
         sublen=<n>
swconfig swid=<string> nspf=e164 cc=<number> {[ic=<number>] | [ndc=<number> [area=<number>]]} [ind=<number>] sgclen={<n> | none} [sgc=<number>] siclen={<n> | none} [sic=<number>]
         sublen=<n>

# Penjelasan parameter konfigurasi:
# swid: Nilai string untuk identifikasi instance VFRS ini dalam antarmuka konsol dan berkas log, maks 32 karakter (default: "vfrs0")
# nspf: Jenis sistem penomoran utama yang digunakan (E.164 atau X.121) (default: x121)

# Untuk nspf=x121:
# dcc: Kode negara untuk jaringan data (Data Country Code), 3 digit (default: 100)
# nd: Network Digit (kode jaringan) setelah DCC, 1 digit (default: 0)
# dnic: Kode identifikasi jaringan data (Data Network Identification Code), 4 digit (termasuk DCC), menggantikan dcc(+nd) jika dikonfigurasi bersamaan (default: 1000)
# pnic: Kode identifikasi jaringan data privat (Private data Network Identification Code) (default: tidak ada)
# ind: Kode identifikasi/perutean internal jaringan (default: tidak ada)
# sgclen: Panjang Kode Kelompok Sistem (KKS/SGC) dalam digit (default: 1)
# sgc: Kode Kelompok Sistem (KKS/SGC) milik instance VFRS ini (default: 1)
# siclen: Panjang Kode Identifikasi Sistem (KIS/SIC) dalam digit (default: 1)
# sic: Kode Identifikasi Sistem (KIS/SIC) milik instance VFRS ini (default: 1)
# sublen: Panjang nomor pelanggan/terminal yang akan diberikan secara otomatis oleh VFRS (default: 14 - (panjang DCC + ND/DNIC + panjang PNIC + panjang IND + panjang SGC + panjang SIC))

# Untuk nspf=e164:
# cc: Kode negara (Country Code), 1-3 digit (default: 62)
# ic: Kode identifikasi jaringan internasional (Identification Code), 1-4 digit (default: tidak ada)
# ndc: Kode identifikasi jaringan nasional (National Destination Code) (default: tidak ada)
# area: Kode area (default: tidak ada)
# ind: Kode identifikasi/perutean internal jaringan (default: tidak ada)
# sgclen: Panjang Kode Kelompok Sistem (KKS/SGC) dalam digit (default: 1)
# sgc: Kode Kelompok Sistem (KKS/SGC) milik instance VFRS ini (default: 1)
# siclen: Panjang Kode Identifikasi Sistem (KIS/SIC) dalam digit (default: 1)
# sic: Kode Identifikasi Sistem (KIS/SIC) milik instance VFRS ini (default: 1)
# sublen: Panjang nomor pelanggan/terminal yang akan diberikan secara otomatis oleh VFRS (default: 15 - (panjang CC + panjang IC/NDC + panjang area + panjang IND + panjang SGC + panjang SIC))

log level con={trace | debug | info | warn | error} txt={trace | debug | info | warn | error}
log file <log-file-path>
log rotation size=<number> files=<number>

# Penjelasan parameter konfigurasi log:
# con: Level log untuk ditampilkan di konsol (default: info)
# txt: Level log untuk ditampilkan di berkas log (default: info)
# <log-file-path>: Jalur berkas log (default: vfrs.log di direktori kerja saat ini)
# size: Ukuran maksimum berkas log sebelum rotasi (default: 10 MB)
# files: Jumlah berkas log yang disimpan setelah rotasi (default: 5)

default interface dlcibit={10 | 23} ar=<bps>
default lapf k=<n> n200=<n> n201=<n> t200=<s> t203=<s>
default lmi-dce n392=<n> n393=<n> t392=<s>
default lmi-dte n391=<n> n392=<n> n393=<n> t391=<s>
default pvc cir=<bps> bc=<bits> be=<bits> ftp=<0-15> fdp=<0-7> class=<0-3>
default svc cir=<bps> bc=<bits> be=<bits> fmif=<octets> ftp=<0-15> fdp=<0-7> class=<0-3> {revchg={allow | deny} | {ogrevchg={allow | deny} [icrevchg={allow | deny}]}}
default svc mcast cir=<bps> bc=<bits> be=<bits> fmif=<octets> ftp=<0-15> fdp=<0-7> class=<0-3> {revchg={allow | deny} | {ogrevchg={allow | deny} [icrevchg={allow | deny}]}}
default svc nni t303=<s> t305=<s> t308=<s> t310=<s> t301=<s> t316=<s> t317=<s> t322=<s>
default svc uni t303=<s> t305=<s> t308=<s> t310=<s> t301=<s> t316=<s> t317=<s> t322=<s>

port <port-name> {pipe-client | pipe-server} <pipe-name> [dlcibit={10 | 23}] [ar=<bps>]
port <port-name> l2tpv3fr [<local-host>] <remote-host> <base-vcid> [dlcibit={10 | 23}] [ar=<bps>]
port <port-name> l2tpv3hdlc [<local-host>] <remote-host> <vcid> [dlcibit={10 | 23}] [ar=<bps>]
port <port-name> serial <serial-device> [baud=<number>] [dlcibit={10 | 23}] [ar=<bps>]
port <port-name> tcp [<local-host>] <local-port> <remote-host> <remote-port> [dlcibit={10 | 23}] [ar=<bps>]
port <port-name> tcp-client <remote-host> <remote-port> [dlcibit={10 | 23}] [ar=<bps>]
port <port-name> tcp-server [<bind-ip>] <local-port> [dlcibit={10 | 23}] [ar=<bps>]
port <port-name> udp [<local-host>] <local-port> <remote-host> <remote-port> [dlcibit={10 | 23}] [ar=<bps>]
port <port-name> udp-client <remote-host> <remote-port> [dlcibit={10 | 23}] [ar=<bps>]
port <port-name> udp-server [<bind-ip>] <local-port> [dlcibit={10 | 23}] [ar=<bps>]

# Penjelasan parameter konfigurasi port:
# dlcibit: Jumlah bit DLCI (10 atau 23) untuk port ini (default: 10)
# ar: Kecepatan akses (access rate) dalam bit per detik (bps) untuk port ini (default: 0 untuk tcp/udp/pipe/l2tpv3, baud rate untuk serial)

pvc <port-name-1> <dlci-1> <port-name-2> <dlci-2> [cir=<bps>] [bc=<bits>] [be=<bits>] [ftp=<0-15>] [fdp=<0-7>] [class=<0-3>]

pvc mcast <group-name> [cir=<bps>] [bc=<bits>] [be=<bits>] [ftp=<0-15>] [fdp=<0-7>] [class=<0-3>]
pvc mcast group <group-name> <source-port-name> <source-dlci> [oneway | twoway | nway]
pvc mcast member <group-name> <member-port-name> <member-dlci> [cir=<bps>] [bc=<bits>] [be=<bits>] [ftp=<0-15>] [fdp=<0-7>] [class=<0-3>]

lmi <port-name> [dce] [ansi | cisco | none | q933a] [t392=<s>] [n392=<n>] [n393=<n>] [async={true | false}]
lmi <port-name> dte [ansi | cisco | q933a] [t391=<s>] [n391=<n>] [n392=<n>] [n393=<n>] [async={true | false}]

lapf <port-name> [sabme={active | passive | bidirectional}] [xid={active | passive | disable}] [k=<n>] [n200=<n>] [n201=<n>] [t200=<s>] [t203=<s>]

svc int <port-name> [dlci_low=<number>] [dlci_high=<number>] [t303=<s>] [t305=<s>] [t308=<s>] [t310=<s>] [t301=<s>] [t316=<s>] [t317=<s>] [t322=<s>] [cirdef=<bps>]
                    [bcdef=<bits>] [bedef=<bits>] [fmifdef=<octets>] [ftpdef=<0-15>] [fdpdef=<0-7>] [clsdef=<0-3>] [revchg={allow | deny} | {ogrevchg={allow | deny} [icrevchg={allow | deny}]}]

svc addr <port-name> manual [x121 | e164] <primary-full-number>
                            [alias [x121 | e164] <alias-full-number> [revchg={allow | deny} | {ogrevchg={allow | deny} [icrevchg={allow | deny}]}]]
svc addr <port-name> autoprefix [x121 | e164] <primary-subscriber-number>
                                [alias [x121 | e164] <alias-full-number> [revchg={allow | deny} | {ogrevchg={allow | deny} [icrevchg={allow | deny}]}]]
svc addr <port-name> autonumber [x121 | e164] {global | group | global-reverse | group-reverse}
                                [alias [x121 | e164] <alias-full-number> [revchg={allow | deny} | {ogrevchg={allow | deny} [icrevchg={allow | deny}]}]]


svc route <port-name> x121 {dcc=<nnn> [nd={<n> | none}] | dnic=<nnnn>} [pnic={<number> | none}] [ind=<number>] sgclen={<n> | none} [sgc=<number>] siclen={<n> | none} [sic=<number>]
                           [revchg={allow | deny} | {ogrevchg={allow | deny} [icrevchg={allow | deny}]}]
svc route <port-name> e164 cc=<number> {[ic=<number>] | [ndc=<number> [area=<number>]]} [ind=<number>] sgclen={<n> | none} [sgc=<number>] siclen={<n> | none} [sic=<number>]
                           [revchg={allow | deny} | {ogrevchg={allow | deny} [icrevchg={allow | deny}]}]
svc route <port-name> prefix {x121 | e164} <prefix-regex> [revchg={allow | deny} | {ogrevchg={allow | deny} [icrevchg={allow | deny}]}]

svc mcast <group-name> conference [x121 | e164] <conference-full-number>
svc mcast <group-name> subaddress <subaddressing-number>
svc mcast <group-name> confsubadd [x121 | e164] <conference-full-number> <subaddressing-number>
svc mcast <group-name> source {x121 | e164} {<source-full-number>|<port-name>} [subaddr=<subaddressing-number>] [oneway | twoway | nway]
svc mcast <group-name> member {x121 | e164} {<member-full-number>|<port-name>} [subaddr=<subaddressing-number>]

spvc pvc-link <port-name-1> <local-dlci> [lspvcid=<local-correlator-id>] <dest-vfrs-number>
              tgt={specific | correlator} {tdlci=<target-dlci> | tspvcid=<target-correlator-id>}
              [cir=<bps>] [bc=<bits>] [be=<bits>] [ftp=<0-15>] [fdp=<0-7>] [class=<0-3>] [revchg={allow | deny} | {ogrevchg={allow | deny} [icrevchg={allow | deny}]}]

issmp <port-name> {enable | disable} as=<number> isic=<number> cost=<number> [pw=<string>]

cgst <port-name> rate=<fps> [clear=<fps>] [threshold=<number>] [cllm={enable | disable} [txint=<s>]]

capture {<port-name> | <group-name> | global | all} <pcap-file-path> [svccap={iframe | uiframe}]

# Penjelasan parameter konfigurasi:
# svccap: Jenis/tipe frame yang digunakan untuk menyimpan paket SVC Q.933/X.36/X.76 (yang menggunakan LAPF I-frame) dalam berkas pcap (default:iframe)
