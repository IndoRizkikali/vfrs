# ======================================================================
# KONFIGURASI VFRS INSTANCE: vfrsTestSvc
# Uji Coba Integrasi Persinyalan SVC (ITU-T X.36 / Q.933) dengan Dynamips Cisco 3660
# ======================================================================

swconfig swid=vfrsTestSvc dnic=5104 sgclen=2 sgc=1 siclen=2 sic=1 subnumlen=4
log_level con=info txt=debug
log_file vfrsTestSvc.log

# Default global service & protocol parameters
defaults ar=4032000 svc_default_cir=512000 svc_default_bc=512000

# Antarmuka UDP untuk Dynamips Cisco 3660 DTE:
# uni0/0: terhubung ke Cisco 3660 R1 (Serial1/0, local 10000 <-> remote 10001)
port uni0/0 udp 127.0.0.1 10000 127.0.0.1 10001

# uni0/1: terhubung ke Cisco 3660 R2 (Serial1/0, local 10002 <-> remote 10003)
port uni0/1 udp 127.0.0.1 10002 127.0.0.1 10003

# uni0/2: terhubung ke Cisco 3660 R3 (Serial1/0, local 10004 <-> remote 10005)
port uni0/2 udp 127.0.0.1 10004 127.0.0.1 10005

# uni0/3: terhubung ke Cisco 3660 R4 (Serial1/0, local 10006 <-> remote 10007)
port uni0/3 udp 127.0.0.1 10006 127.0.0.1 10007

# Konfigurasi LMI Q.933 Annex A (sesuai 'frame-relay lmi-type q933a' pada Cisco IOS)
lmi uni0/0 q933a
lmi uni0/1 q933a
lmi uni0/2 q933a
lmi uni0/3 q933a

# Pengaktifan Layanan & Persinyalan SVC (ITU-T X.36 Clause 10)
svc_int uni0/0 dlci_low=512 dlci_high=991
svc_int uni0/1 dlci_low=512 dlci_high=991
svc_int uni0/2 dlci_low=512 dlci_high=991
svc_int uni0/3 dlci_low=512 dlci_high=991

# Registrasi Penomoran Pelanggan SVC:
# R1: Nomor E.164 '1000' (dengan alias X.121 DGE1000 / 510401011000)
svc_addr uni0/0 x121 DGE1000 alias=e164,1000

# R2: Nomor E.164 '1001' (dengan alias X.121 DGE1001 / 510401011001)
svc_addr uni0/1 x121 DGE1001 alias=e164,1001

# R1: Nomor E.164 '1000' (dengan alias X.121 DGE1000 / 510401011000)
svc_addr uni0/2 x121 DGE1002 alias=e164,1002

# R2: Nomor E.164 '1001' (dengan alias X.121 DGE1001 / 510401011001)
svc_addr uni0/3 x121 DGE1003 alias=e164,1003

# Perekaman Trafik Frame Relay PCAP (Wireshark)
capture uni0/0 uni0_0_vfrsTestSvc.pcap
capture uni0/1 uni0_1_vfrsTestSvc.pcap
capture uni0/2 uni0_2_vfrsTestSvc.pcap
capture uni0/3 uni0_3_vfrsTestSvc.pcap
