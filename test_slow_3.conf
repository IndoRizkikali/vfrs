# vfr_switch - Berkas contoh konfigurasi
#              (Draf)
#
# Ketentuan penamaan antarmuka (Cisco-style interface groups):
#   uni<X>/<Y>  antarmuka UNI (X.36 user-to-network interface)
#               VFRS berperan sebagai DCE pada tipe antarmuka ini
#   nni<X>/<Y>  antarmuka NNI (X.76 network-to-network interface)
#               VFRS berperan sebagai DCE dan DTE sekaligus pada
#               tipe antarmuka ini
#   X = kode kelompok antarmuka, 0-255
#   Y = kode antarmuka anggota dari kelompok antarmuka, 0-255
# Contoh: uni0/0, uni1/0, nni0/0, nni1/0
# Jumlah maksimum antarmuka per instance VFRS adalah 131072
# (2 * 256 * 256).
# Jumlah maksimum antarmuka per tipe antarmuka per instance VFRS
# adalah 65536.
#
# Baris yang dimulai dengan tanda pagar (#) adalah komentar.

# ===============================================================
# KONFIGURASI DASAR SWITCH
# ===============================================================
# Mengatur konfigurasi dasar dan utama switch, yang meliputi
# identifikasi switch, kode negara data (DCC), kode jaringan
# (ND), kode identifikasi jaringan data (DNIC), kode kelompok
# sistem (system group code, SGC/KKS), kode identikasi sistem
# (system identification code, SIC/KIS), dan panjang nomor
# pelanggan/terminal default untuk pengalamatan otomatis.
#
# Format: swconfig <key1=value1> [key2=value2] [key3=value3] ...
# Parameter:
#   swid=<string>      Nilai string untuk identifikasi instance VFRS ini
#                      dalam konsol dan berkas log (default: "vfrs0")
#   dcc=NNN            Data Country Code (kode negara data) milik instance
#                      ini untuk persinyalan dan perutean SVC NNI
#                      (3 digit, default: 100)
#   nd=<number>|none   Network Digit (kode jaringan) setelah DCC milik
#                      instance ini untuk persinyalan dan perutean SVC NNI
#                      (0/tidak ada sampai 6 digit, default: none)
#   dnic=NNNN          Data Network Identification Code
#                      (kode identifikasi jaringan data) milik instance ini
#                      untuk persinyalan dan perutean SVC NNI,
#                      jika dikonfigurasi bersama DCC dan/atau ND
#                      maka akan menggantikan konfigurasi DCC + ND
#                      (4 digit, default: 1000)
#   sgclen=N           Panjang Kode Kelompok Sistem (KKS/SGC) milik
#                      instance ini untuk persinyalan dan perutean SVC NNI
#                      (angka 1 sampai 4, default: 1)
#   sgc=<number>       Kode Kelompok Sistem (KKS/SGC) untuk persinyalan
#                      dan perutean SVC NNI (1 sampai 4 digit, default: 1)
#                      Jika panjang nilai KKS yang dikonfigurasikan disini 
#                      kurang dari panjang nilai yang dikonfigurasikan di
#                      sgclen, maka akan dipadding di depan nilai KKS dengan 0
#   siclen=N           Panjang Kode Identifikasi Sistem (KIS/SIC) milik
#                      instance ini untuk persinyalan dan perutean SVC NNI
#                      (angka 1 sampai 4, default: 1)
#   sic=<number>       Kode Identifikasi Sistem (KIS/SIC) untuk persinyalan
#                      dan perutean SVC NNI (1 sampai 4 digit, default: 1)
#                      Jika panjang nilai KIS yang dikonfigurasikan disini 
#                      kurang dari panjang nilai yang dikonfigurasikan di
#                      siclen, maka akan dipadding di depan nilai KIS dengan 0
#   subnumlen=N        Panjang nomor pelanggan/terminal yang akan diberikan secara
#                      otomatis, hanya berlaku jika sistem alokasi penomoran
#                      otomatis dikonfigurasikan pada (masing-masing) antarmuka
#                      UNI (angka 1 sampai 6, default: 4)

# Pada contoh ini, karena panjang nilai sgc sebesar 1 digit, sedangkan nilai
# sgclen adalah 2, maka kode kelompok sistem yang dibuat adalah `01`, bukan `1`.
# Begitu juga pada sic=1 dan siclen=2, juga menghasilkan kode identifikasi
# sistem `01`, bukan `1`.
swconfig swid=vfrsA dnic=5104 sgclen=2 sgc=1 siclen=2 sic=1 subnumlen=4

# ===============================================================
# TINGKAT LOG
# ===============================================================
# Mengatur tingkat log yang ditampilkan dan/atau disimpan oleh VFRS.
#
# Format: log_level con=<level> [txt=<level>]
# Parameter: 
#   con=<level>    Mengatur tingkat log yang ditampilkan
#                  oleh konsol VFRS ke pengguna
#   txt=<level>    Mengatur tingkat log yang disimpan
#                  dalam berkas log oleh VFRS 
#   <level>:       debug, info (default), warn, error

log_level con=info txt=debug

# ===============================================================
# BERKAS LOG
# ===============================================================
# Mengatur alamat berkas log yang disimpan oleh VFRS.
# Pengaturan ini bersifat opsional.
#
# Format: log_file <log_file_path>

log_file vfrs_slow_3.log

# ===============================================================
# KONFIGURASI DEFAULT GLOBAL
# ===============================================================
# Mengatur nilai penghitung/pewaktu default ke seluruh antarmuka
# sebelum konfigurasi override per antarmuka yang ditentukan.
# Apabila salah satu dari parameter-parameter bawah ini dikonfigurasi,
# maka nilai parameter custom yang diatur disini akan menggantikan
# nilai konstanta tetap yang dikodekan secara permanen pada saat
# kompilasi program.
# Letakkan konfigurasi default global SEBELUM konfigurasi per antarmuka.
#
# Format: defaults <key1=value1> [key2=value2] [key3=value3] ...
#
# Parameter untuk LAPF (Q.922 §5.9):
#   lapf_k=<n>      Window size (compile-time: 8)
#   lapf_n200=<n>   Max retransmissions (compile-time: 3)
#   lapf_n201=<n>   Max I-frame info field, octets (compile-time: 260)
#   lapf_t200=<s>   Retransmission timer, seconds (compile-time: 2s)
#   lapf_t203=<s>   Idle timer, seconds (compile-time: 30s)
#
# Parameter untuk LMI (X.36 §11.6, X.76 §11.7):
#   lmi_dte_n391=<n>   Global DTE N391 default (1-255; 0=unset, compile-time: 6)
#   lmi_dte_n392=<n>   Global DTE N392 default (1-10; 0=unset, compile-time: 3)
#   lmi_dte_n393=<n>   Global DTE N393 default (1-10; 0=unset, compile-time: 4)
#   lmi_dte_t391=<s>   Global DTE T391 default (5-30; 0=unset, compile-time: 10s)
#   lmi_n392=<n>       Global DCE N392 default (1-10; 0=unset, compile-time: 3)
#   lmi_n393=<n>       Global DCE N393 default (1-10; 0=unset, compile-time: 4)
#   lmi_t392=<s>       Global DCE T392 default (5-30; 0=unset, compile-time: 15s)
#
# Parameter pewaktu untuk SVC UNI (X.36 §10.11.2):
#   svc_uni_t303=<s>   SETUP sent, awaiting response (compile-time: 4s)
#   svc_uni_t305=<s>   DISCONNECT sent (compile-time: 30s)
#   svc_uni_t308=<s>   RELEASE sent (compile-time: 4s)
#   svc_uni_t310=<s>   Awaiting CONNECT after CALL PROC (compile-time: 35s)
#   svc_uni_t316=<s>   RESTART sent (compile-time: 120s)
#   svc_uni_t317=<s>   RESTART received, internal clear (compile-time: 10s)
#   svc_uni_t322=<s>   STATUS ENQUIRY sent (compile-time: 4s)
#
# Parameter pewaktu untuk SVC NNI (X.76 §10.6.8):
#   svc_nni_t303=<s>   SETUP sent, awaiting response (compile-time: 4s)
#   svc_nni_t308=<s>   RELEASE sent (compile-time: 4s)
#   svc_nni_t310=<s>   Awaiting CONNECT after CALL PROC (compile-time: 40s)
#   svc_nni_t316=<s>   RESTART sent (compile-time: 120s)
#   svc_nni_t317=<s>   RESTART received, internal clear (compile-time: 20s)
#   svc_nni_t322=<s>   STATUS ENQUIRY sent (compile-time: 4s)
#
# Pembatasan QoS untuk SVC (per-port overridable, see 'svc' command):
#   svc_max_fmif=<n> Max frame size cap for SVCs
#   svc_max_cir=<n>  Max CIR cap (bps)
#   svc_min_cir=<n>  Min CIR floor (bps)
#   svc_max_bc=<n>   Max Bc cap (bits)
#   svc_max_be=<n>   Max Be cap (bits)
#
# Service parameters (X.36 §8.2, §8.3):
#   access_rate=<bps>           Physical access rate for all ports (§8.2.1)
#   svc_default_cir=<bps>       Default CIR for SVCs when DTE omits LLCORE
#   svc_default_bc=<bits>       Default Bc for SVCs (§8.3.3)
#   svc_default_be=<bits>       Default Be for SVCs (§8.3.3)
#   svc_default_fmif=<octets>   Default max frame size for SVCs (§8.3.3)
#   svc_default_ftp=<0-15>      Default Frame Transfer Priority (§7.4, §8.3.6)
#   svc_default_fdp=<0-7>       Default Frame Discard Priority (§7.5, §8.3.6)
#   svc_default_svc_class=<0-3> Default Service Class (§7.6, Table 7-1)
#
# defaults lapf_t200=2 lapf_n200=3 lapf_k=7
# defaults svc_t303=4 svc_t310=30
# defaults access_rate=64000 svc_default_cir=32000 svc_default_bc=32000
# defaults svc_default_ftp=8 svc_default_fdp=4 svc_default_svc_class=1

# ===============================================================
# DEFINISI ANTARMUKA
# ===============================================================
# Mendefinisikan antarmuka-antarmuka yang diaktifkan oleh instance
# VFRS ini.
#
# Format: port <name> <transport> [transport-args...]
# Nama antarmuka harus menggunakan format uni<X>/<Y> atau nni<X>/<Y>.
#
# Mode transport frame yang didukung:
#  - Named pipe
#   port <name> pipe-client <nama_pipa> [dlcibit=<10|23>]
#   port <name> pipe-server <nama_pipa> [dlcibit=<10|23>]
#  - Antarmuka serial (fisik/virtual)
#   port <name> serial      <device> <baudrate> [dlcibit=<10|23>]
#  - TCP raw socket
#   port <name> tcp         [<local_addr>] <local_port> <remote_addr> <remote_port>
#                           [dlcibit=<10|23>]
#   port <name> tcp-client  <remote_addr> <port> [dlcibit=<10|23>] 
#   port <name> tcp-server  [<bind_addr>] <port> [dlcibit=<10|23>]
#  - UDP raw socket
#   port <name> udp         [<local_addr>] <local_port> <remote_addr> <remote_port>
#                           [dlcibit=<10|23>]
#   port <name> udp-client  <remote_addr> <port> [dlcibit=<10|23>]
#   port <name> udp-server  [<bind_addr>] <port> [dlcibit=<10|23>]
#  - L2TPv3 (untuk masa depan, hanya untuk NNI antar VFRS dan UNI dengan DTE VFRNS)
#   port <name> l2tpv3-fr   [<local_addr>] <remote_addr> <base_vcid> [dlcibit=<10|23>]
#   port <name> l2tpv3-hdlc [<local_addr>] <remote_addr> <vcid> [dlcibit=<10|23>]
#
# Untuk named pipe, diharuskan salah satu ujung sebagai server (pembuat pipa) dan
# ujung yang lain sebagai client. Jika ujung yang berperan sebagai server tidak berjalan,
# maka saat ujung client dijalankan, antarmuka klien dengan transport tersebut tidak akan
# tersedia.
# Untuk soket TCP/UDP:
#  - `tcp`/`udp`: mode berpasangan, kedua ujung mendengarkan dan membuat koneksi
#  - `tcp-client`\`udp-client`: mode client, membuat koneksi dari port soket acak ke port
#                               soket di server
#  - `tcp-server`\`udp-server`: mode server, menerima koneksi di port soket server
#                               dari port soket acak client
# L2TPv3 akan tersedia di masa depan. Mode transport ini hanya tersedia untuk koneksi NNI 
# antar instance VFRS dan untuk koneksi UNI dengan DTE VFRNS (VFRAD/VFRTAC), serta dengan 
# DTE Frame Relay lainnya yang terhubung langsung atau melalui perantara konverter L2TPv3.
# L2TPv3 di VFRS akan mendukung 2 mode:
#  - HDLC over L2TPv3 (RFC 4349): L2TPv3 berperan sebagai 'kabel', mengangkut seluruh frame
#    'FR port-to-port pseudowire' Frame Relay hampir secara utuh (tanpa flag dan FCS),
#                                 dari suatu antarmuka ke antarmuka lain (port-to-port)
#                                 tanpa memandang tipe dan isi frame, selama masih berupa
#                                 frame HDLC (Frame Relay menggunakan format frame HDLC).
#  - FR over L2TPv3 (RFC 4591): L2TPv3 berperan sebagai 'terowongan', mengangkut seluruh
#    'FR PVC pseudowire'        frame Frame Relay hampir secara utuh (tanpa flag dan FCS),
#                               dari suatu DLCI dalam suatu antarmuka lokal ke DLCI lain
#                               pada antarmuka tujuan (DLCI-based FR PVC pseudowire).
# Pada mode transport L2TPv3, diwajibkan untuk memberikan parameter Virtual Circuit ID
# (VCID) untuk identifikasi pseudowire L2TPv3. Konfigurasi VCID harus sama diantara
# kedua ujung koneksi L2TPv3.
#
# Format pengalamatan (untuk soket TCP/UDP dan L2TPv3):
#   - IPv4: "127.0.0.1", "0.0.0.0" (bind all interfaces)
#   - IPv6: "::1", "::" (bind all interfaces)
#   - Hostname: "localhost", "router1.example.com"
#   - Kosong/dihilangkan: bind to all interfaces (0.0.0.0 dan/atau ::)
#
# Baudrate maksimum untuk serial adalah 8192000 bps, tergantung dari
# OS yang berjalan serta driver yang terinstalasi.
#
# Framing: TCP dan named pipe menggunakan prefix panjang big-endian 4-byte
# (4-byte big-endian length prefix), yang kompatibel dengan dynamips.
#
# Access rate (AR) auto-derivation (X.36 §8.2.1):
#   For serial ports, the access rate is automatically derived from the
#   baud rate if not explicitly configured.  This constrains SVC max_cir
#   and PVC CIR to never exceed the physical line rate.
#   For other transports, use 'congestion <port> access_rate=<bps>' or
#   'defaults access_rate=<bps>' to set it manually.
#
# Secara default, seluruh antarmuka menggunakan alamat DLCI 10-bit,
# (0-1023). Jika diperlukan, dapat digunakan alamat DLCI 23-bit,
# melalui konfigurasi dlcibit.

# Konfigurasi 4 endpoint soket UDP ke loopback untuk uji coba,
# terhubung sebagai antarmuka UNI dalam satu kelompok yang sama
#    portid udp lhost     lport rhost     rport 
port uni0/0 udp 127.0.0.1 10000 127.0.0.1 10001
port uni0/1 udp 127.0.0.1 10002 127.0.0.1 10003
port uni0/2 udp 127.0.0.1 10004 127.0.0.1 10005
port uni0/3 udp 127.0.0.1 10006 127.0.0.1 10007

# TCP server port waiting for a connection
# Listens on the specified address/port; TCP_NODELAY and SO_KEEPALIVE are enabled.
# port uni1/0 tcp-server 0.0.0.0 10010
# port uni1/0 tcp-server :: 10010

# TCP client with auto-reconnection (exponential backoff 1s-60s)
# Automatically reconnects if the connection drops.
# port uni1/0 tcp-client 10.1.0.1 10010
# port uni1/0 tcp-client localhost 10010          # hostname
# port uni1/0 tcp-client ::1 10010                # IPv6 loopback

# Antarmuka Named pipe dalam format Windows (UNI)
# port uni1/1 pipe-server \\.\pipe\vfr_uni11

# Antarmuka serial (Windows / Linux)
# Access rate auto-derived: 115200 baud -> AR = 115200 bps
# port uni2/0 serial COM3 115200
# port uni2/1 serial /dev/ttyUSB0 115200

# Antarmuka NNI (Network-to-Network Interface)
# Polling LMI dua arah secara simetris wajib dilakukan pada antarmuka
# tipe NNI. Hanya protokol LMI tipe X.36/X.76 (PD=0x08) yang dapat
# digunakan untuk antarmuka NNI.
# port nni0/0 tcp-client 10.1.0.1 20000
# port nni0/1 tcp-server 0.0.0.0 20001

# ===============================================================
# DEFINISI PVC (Permanent Virtual Circuits)
# ===============================================================
# Membuat pemetaan DLCI dua arah (dua entri tabel switching).
# Koneksi PVC dibuat secara permanen dan menghubungkan antara 2 DLCI
# dari 2 antarmuka yang berbeda.
#
# Format: pvc <port1> <dlci1> <port2> <dlci2> [cir=<bps>] [bc=<bits>]
#             [be=<bits>] [ftp=<0-15>] [fdp=<0-7>] [srvcls=<0-3>]
# Parameter layanan opsional (X.36 §7.4-7.6, §8.2):
#   cir         Committed Information Rate, dalam bps (traffic policing)
#   bc          Committed burst size Bc, dalam bit (Tc = Bc/CIR)
#   be          Excess burst size Be, dalam bit
#   ftp         Frame Transfer Priority, 0 sampai 15
#               (lebih tinggi = waktu penundaan yang lebih baik)
#   fdp         Frame Discard Priority, 0 sampai 7
#               (lebih tinggi = dibuang lebih terakhir)
#   srvcls      Service Class (per X.36 Table 7-1), 0 sampai 3
#
# Pengaturan lalu lintas: token bucket tiga lapis memberlakukan CIR/Bc/Be.
# Lalu-lintas Committed (dalam Bc): diteruskan apa adanya
# Lalu-lintas berlebih (dalam Be): bit DE disetel (X.36 §8.2)
# Di luar Bc+Be: seperti lalu-lintas berlebih, tetapi akan lebih lambat
#                diproses dan akan dapat langsung dibuang
#
# Rentang DLCI 10-bit per X.36:
#            0 Reserved for LMI (Clause 11 X.36/X.76) over UI-frame,
#              and SVC signaling (Clause 10 X.36/X.76) over I-frame
#     1 -   15 Reserved for future use
#    16 -  991 User data circuits (PVCs and SVCs)
#   992 - 1007 Layer 2 management of FRDTS, such as CLLM
#  1008 - 1022 Reserved for future use
#         1023 Reserved for in channel layer 2 management 
#              (Cisco/Gang of Four LMI)

# Koneksi PVC antara uni0/0 dan uni0/1
pvc uni0/0 100 uni0/1 100

# Koneksi PVC antara uni0/0 dan uni0/2
pvc uni0/0 101 uni0/2 100

# Koneksi PVC antara uni0/1 dan uni0/2
pvc uni0/1 101 uni0/2 101

# Koneksi PVC NNI:
# DTE UNI lokal <-> VFRS lokal <- NNI -> VFRS tujuan <-> DTE UNI tujuan
# Pastikan nilai DLCI pada antarmuka NNI lokal sama dengan nilai DLCI pada
# antarmuka NNI VFRS tujuan, dan dihubungkan dengan DLCI pada antarmuka UNI ke 
# DTE tujuan oleh instance VFRS tujuan.
# pvc uni0/0 110 nni0/0 210
# pvc uni0/1 111 nni0/0 211

# Koneksi PVC dengan pengaturan lalu-lintas dan prioritas frame
# pvc uni0/0 103 uni0/1 203 cir=64000 bc=64000 be=32000 ftp=8 fdp=4

# ===============================================================
# KONFIGURASI LMI (Q.933 Annex A / T1.617 Annex D / Cisco)
# ===============================================================
# Mengaktifkan dan mengatur protokol persinyalan LMI
# (Local Management Interface) untuk pengelolaan koneksi PVC.
# Apabila suatu antarmuka tidak dikonfigurasikan secara eksplisit
# dengan `lmi`, maka antarmuka tersebut tidak dilayani/dikelola oleh
# protokol LMI.
#
# Format: lmi <port_name> [q933a|ansi|cisco|none] [t392=<s>] [n392=<n>] [n393=<n>]
# Tipe protokol LMI yang didukung:
#   q933a   ITU-T Q.933 Annex A - VFRS menggunakan LMI versi ITU-T X.36/X.76 Klausa 11,
#           yang sama persis secara bitstream dengan Q.933 Annex A,
#           dan dengan tambahan peningkatan pada lampiran X.36 Annex G/X.76 Annex C
#   ansi    ANSI T1.617 Annex D
#   cisco   Protokol LMI vendor Gang of Four (Cisco-DEC-Nortel-StrataCom)
#   none    Protokol LMI dinonaktifkan pada antarmuka ini
# Secara default, VFRS menggunakan LMI tipe Q.933 Annex A, jika tipe LMI yang
# digunakan tidak dinyatakan secara eksplisit.
#
# Parameter DCE LMI:
#   n392  Error threshold, 1-10 (default: 3)
#   n393  Monitored events window, 1-10 (default: 4)
#   t392  DCE polling verification timer, 5-30 seconds (default: 15s)

# Konfigurasi LMI pada 4 antarmuka UNI dalam kelompok yang sama,
# dengan tipe protokol Q.933 Annex A dan nilai parameter standar
# (kecuali digantikan dengan nilai parameter global yang ditetapkan 
# sebelumnya pada bagian Default Global).
lmi uni0/0 q933a t392=20
lmi uni0/1 q933a t392=45
lmi uni0/2 q933a t392=45
lmi uni0/3 q933a t392=45

# Konfigurasi LMI pada antarmuka UNI dengan nilai parameter custom.
# Nilai parameter custom yang ditetapkan ini menggantikan nilai
# parameter LMI global (atau yang dikodekan permanen) di antarmuka ini.
# Jika ada parameter yang tidak ditetapkan di antarmuka ini, maka digunakan
# parameter LMI global (atau yang dikodekan secara permanen).
# lmi uni0/0 q933a t392=20 n392=3 n393=4

# Untuk antarmuka tipe NNI, hanya LMI tipe `q933a` atau `none` yang
# dapat digunakan. Selain itu, akan diubah secara paksa menjadi `q933a`.
# `lmi` tetap dapat digunakan untuk mengubah parameter DCE LMI pada
# antarmuka NNI.
# lmi nni0/0 q933a t392=15 n392=3 n393=4

# ===============================================================
# KONFIGURASI LMI DUA ARAH (Bidirectional LMI)
# ===============================================================
# Mengaktifkan fungsionalitas polling sisi DTE pada suatu antarmuka.
# Apabila diaktifkan pada suatu antarmuka, instance VFRS akan mengirim
# pesan LMI STATUS ENQUIRY dan memproses pesan LMI STATUS dengan DTE
# pada antarmuka tersebut.
#
# Format: lmi_dte <port_name> [t391=<s>] [n391=<n>] [n392=<n>] [n393=<n>]
# Parameter DTE LMI:
#   n391  Full status polling counter, 1-255 (default: 6)
#   n392  Error threshold, 1-10 (default: 3)
#   n393  Monitored events window, 1-10 (default: 4)
#   t391  DTE polling interval, 5-30 seconds (default: 10s)
#
# Apabila antarmuka yang dikonfigurasikan dengan `lmi_dte` tidak 
# dikonfigurasikan dengan `lmi`, maka:
# - Antarmuka UNI: konfigurasi `lmi_dte` ditolak dan tidak diaktifkan
# - Antarmuka NNI: konfigurasi `lmi` diaktifkan secara implisit, dengan
#                  nilai default

# Mengaktifkan mode LMI bidirectional pada antarmuka UNI
# dengan pengaturan nilai custom. Nilai custom disini akan menggantikan
# nilai parameter DTE LMI global di antarmuka ini.
# (Lihat bagian konfigurasi LMI)
# lmi_dte uni0/0 t391=10 n391=6

# Untuk antarmuka tipe NNI, lmi_dte akan diaktifkan secara otomatis
# (diwajibkan berdasarkan X.76 §11.4), untuk persinyalan LMI NNI, apabila
# antarmuka NNI tersebut sudah dikonfigurasikan dengan pengaturan `lmi`.
# Walaupun demikian, `lmi_dte` dapat digunakan untuk mengubah parameter
# DTE LMI pada antarmuka NNI tersebut.
# lmi_dte nni0/0 t391=10 n391=6

# ===============================================================
# Packet Capture (pcap)
# ===============================================================
# Format: capture <port_name|all> <filename> [svc=iframe|ui]
#
# Captures Frame Relay frames in standard pcap format
# (LINKTYPE_FRELAY, DLT 107). Viewable in Wireshark.
# SVC capture mode:
#   svc=iframe  capture LAPF I-frame SVC payloads (default)
#   svc=ui      capture UI-frame SVC payloads

# Per-port capture:
capture uni0/0 uni00_trace.pcap
capture uni0/1 uni01_trace.pcap
capture uni0/2 uni02_trace.pcap
capture uni0/3 uni03_trace.pcap
# capture nni0/0 nni00_trace.pcap

# Global capture (all frames through the switch):
capture all switch_trace_all_4.pcap
