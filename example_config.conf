# vfr_switch - Contoh Berkas konfigurasi
#              (Draf)
#
# Ketentuan penamaan antarmuka (format ala Cisco IOS):
#   uni<X>/<Y>  antarmuka UNI (X.36 user-to-network interface),
#               VFRS berperan sebagai DCE pada tipe antarmuka ini
#   nni<X>/<Y>  antarmuka NNI (X.76 network-to-network interface),
#               VFRS berperan sebagai DCE dan DTE sekaligus pada
#               tipe antarmuka ini
#   X = kode kelompok antarmuka, 0-255
#   Y = kode antarmuka anggota dari kelompok antarmuka, 0-255
# Contoh: uni0/0, uni1/0, nni0/0, nni1/0
# Jumlah maksimum seluruh antarmuka per tiap instance VFRS adalah
# 131072 (2 * 256 * 256).
# Jumlah maksimum antarmuka per tipe antarmuka per tiap instance VFRS
# adalah 65536 (256 * 256).
#
# Baris yang dimulai dengan tanda pagar (#) adalah baris komentar.

# ======================================================================
# KONFIGURASI DASAR SWITCH/INSTANCE VFRS
# ======================================================================
# Mengatur konfigurasi dasar dan utama switch/instance VFRS ini, yang
# meliputi identifikasi switch, kode negara data (DCC), kode jaringan
# (ND), kode identifikasi jaringan data (DNIC), kode identifikasi
# jaringan data privat (PNIC), kode kelompok sistem (system group code,
# SGC/KKS), kode identifikasi sistem (system identification code, SIC/KIS),
# dan panjang nomor pelanggan/terminal default untuk pengalamatan otomatis.
#
# Format: swconfig <key1=value1> [key2=value2] [key3=value3] ...
# Parameter:
#   swid=<string>      Nilai string untuk identifikasi instance VFRS ini
#                      dalam antarmuka konsol dan berkas log (default: "vfrs0")
#   dcc=NNN            Data Country Code (kode negara data) milik instance
#                      ini untuk persinyalan dan perutean SVC NNI
#                      (3 digit, default: 100)
#   nd=<number>|none   Network Digit (kode jaringan) setelah DCC milik
#                      instance ini untuk persinyalan dan perutean SVC NNI
#                      (0/tidak ada sampai 6 digit, default: none)
#   dnic=NNNN          Data Network Identification Code
#                      (kode identifikasi jaringan data) milik instance ini
#                      untuk persinyalan dan perutean SVC NNI,
#                      jika dikonfigurasi bersama DCC dan/atau ND
#                      maka akan menggantikan konfigurasi DCC + ND
#                      (4 digit, default: 1000)
#   pnic=<number>|none Private data Network Identification Code
#                      (kode identifikasi jaringan data privat) milik instance
#                      ini untuk persinyalan dan perutean SVC NNI, setelah DNIC
#                      atau DCC + ND (0/tidak ada sampai 6 digit, default: none)
#   sgclen=N           Panjang Kode Kelompok Sistem (KKS/SGC) milik
#                      instance ini untuk persinyalan dan perutean SVC NNI
#                      (angka 1 sampai 4, default: 1)
#   sgc=<number>       Kode Kelompok Sistem (KKS/SGC) untuk persinyalan
#                      dan perutean SVC NNI (1 sampai 4 digit, default: 1)
#                      Jika panjang nilai KKS yang dikonfigurasikan disini 
#                      kurang dari panjang nilai yang dikonfigurasikan di
#                      sgclen, maka akan dipadding di depan nilai KKS dengan
#                      angka 0 (nol)
#   siclen=N           Panjang Kode Identifikasi Sistem (KIS/SIC) milik
#                      instance ini untuk persinyalan dan perutean SVC NNI
#                      (angka 1 sampai 4, default: 1)
#   sic=<number>       Kode Identifikasi Sistem (KIS/SIC) untuk persinyalan
#                      dan perutean SVC NNI (1 sampai 4 digit, default: 1)
#                      Jika panjang nilai KIS yang dikonfigurasikan disini 
#                      kurang dari panjang nilai yang dikonfigurasikan di
#                      siclen, maka akan dipadding di depan nilai KIS dengan angka
#                      0 (nol)
#   subnumlen=N        Panjang nomor pelanggan/terminal yang akan diberikan secara
#                      otomatis, hanya berlaku jika sistem pengalokasian penomoran
#                      otomatis telah dikonfigurasikan pada (masing-masing) antarmuka
#                      UNI (angka 1 sampai 6, default: 4)

# Pada contoh ini, karena panjang nilai dalam parameter `sgc` adalah sepanjang
# 1 digit, sedangkan nilai `sgclen` adalah 2, maka kode kelompok sistem yang
# dibuat adalah `01`, bukan `1`.
# Begitu juga pada `sic=1` dan `siclen=2`, juga menghasilkan kode identifikasi
# sistem `01`, bukan `1`.
swconfig swid=vfrsA dnic=5104 pnic=none sgclen=2 sgc=1 siclen=2 sic=1 subnumlen=4

# ======================================================================
# TINGKAT LOG
# ======================================================================
# Mengatur tingkat log yang ditampilkan dan/atau disimpan oleh instance
# VFRS ini.
#
# Format: log_level con=<level> [txt=<level>]
# Parameter: 
#   con=<level>    Mengatur tingkat log yang ditampilkan
#                  oleh konsol VFRS ke pengguna
#   txt=<level>    Mengatur tingkat log yang disimpan
#                  dalam berkas log oleh VFRS 
#   <level>:       trace, debug, info (pengaturan default), warn, error

log_level con=info txt=debug

# ======================================================================
# BERKAS LOG & ROTASI LOG
# ======================================================================
# Mengatur alamat berkas log yang disimpan oleh instance VFRS ini dan
# kebijakan rotasi otomatis berkas log.
# Pengaturan ini bersifat opsional. Apabila tidak dikonfigurasikan,
# VFRS tidak akan menghasilkan/membuat berkas log ke disk.
#
# Format:
#   log_file <log_file_path>
#   log_rotation [size=<mb>] [files=<n>]

# log_file C:\vfrns\vfrs\vfrsA.log
log_rotation size=10 files=5

# ======================================================================
# KONFIGURASI DEFAULT GLOBAL
# ======================================================================
# Mengatur nilai parameter/penghitung/pewaktu default ke seluruh antarmuka
# sebelum konfigurasi override/default per tiap antarmuka yang ditentukan.
# Apabila salah satu dari parameter-parameter berikut di bawah ini
# dikonfigurasi, maka nilai parameter default yang diatur disini akan
# menggantikan nilai konstanta default tetap yang dikodekan secara
# permanen pada saat kompilasi program ini.
# Letakkan statement konfigurasi default global SEBELUM konfigurasi default
# umum pada setiap antarmuka-antarmuka maupun konfigurasi spesifik.
#
# Format: defaults <key1=value1> [key2=value2] [key3=value3] ...
#
# Parameter untuk LAPF (Q.922 §5.9):
#   lapf_k=<n>      Window size (compile-time: 8)
#   lapf_n200=<n>   Max retransmissions (compile-time: 3)
#   lapf_n201=<n>   Max I-frame info field, octets (compile-time: 260)
#   lapf_t200=<s>   Retransmission timer, seconds (compile-time: 2s)
#   lapf_t203=<s>   Idle timer, seconds (compile-time: 30s)
#
# Parameter untuk LMI (X.36 §11.6, X.76 §11.7):
#   lmi_dte_n391=<n>   Global DTE N391 default (1-255; 0=unset, compile-time: 6)
#   lmi_dte_n392=<n>   Global DTE N392 default (1-10; 0=unset, compile-time: 3)
#   lmi_dte_n393=<n>   Global DTE N393 default (1-10; 0=unset, compile-time: 4)
#   lmi_dte_t391=<s>   Global DTE T391 default (5-30; 0=unset, compile-time: 10s)
#   lmi_n392=<n>       Global DCE N392 default (1-10; 0=unset, compile-time: 3)
#   lmi_n393=<n>       Global DCE N393 default (1-10; 0=unset, compile-time: 4)
#   lmi_t392=<s>       Global DCE T392 default (5-30; 0=unset, compile-time: 15s)
#
# Parameter pewaktu untuk SVC UNI (X.36 §10.11.2):
#   svc_uni_t303=<s>   SETUP sent, awaiting response (compile-time: 4s)
#   svc_uni_t305=<s>   DISCONNECT sent (compile-time: 30s)
#   svc_uni_t308=<s>   RELEASE sent (compile-time: 4s)
#   svc_uni_t310=<s>   Awaiting CONNECT after CALL PROC (compile-time: 35s)
#   svc_uni_t316=<s>   RESTART sent (compile-time: 120s)
#   svc_uni_t317=<s>   RESTART received, internal clear (compile-time: 10s)
#   svc_uni_t322=<s>   STATUS ENQUIRY sent (compile-time: 4s)
#
# Parameter pewaktu untuk SVC NNI (X.76 §10.6.8):
#   svc_nni_t303=<s>   SETUP sent, awaiting response (compile-time: 4s)
#   svc_nni_t308=<s>   RELEASE sent (compile-time: 4s)
#   svc_nni_t310=<s>   Awaiting CONNECT after CALL PROC (compile-time: 40s)
#   svc_nni_t316=<s>   RESTART sent (compile-time: 120s)
#   svc_nni_t317=<s>   RESTART received, internal clear (compile-time: 20s)
#   svc_nni_t322=<s>   STATUS ENQUIRY sent (compile-time: 4s)
#
# Parameter layanan dan QoS (X.36 §8.2, §8.3):
#   ar=<bps>                    Physical access rate for all ports (§8.2.1)
#   svc_default_cir=<bps>       Default CIR for SVCs when DTE omits LLCORE
#   svc_default_bc=<bits>       Default Bc for SVCs (§8.3.3)
#   svc_default_be=<bits>       Default Be for SVCs (§8.3.3)
#   svc_default_fmif=<octets>   Default max frame size for SVCs (§8.3.3)
#   svc_default_ftp=<0-15>      Default Frame Transfer Priority (§7.4, §8.3.6)
#   svc_default_fdp=<0-7>       Default Frame Discard Priority (§7.5, §8.3.6)
#   svc_default_svc_class=<0-3> Default Service Class (§7.6, Table 7-1)

defaults lapf_t200=2 lapf_n200=3 lapf_k=8 lapf_n201=260 lapf_t203=30 \
         lmi_t392=15 lmi_n392=3 lmi_n393=4 lmi_dte_t391=10 lmi_dte_n391=6 lmi_dte_n392=3 lmi_dte_n393=4 \
         ar=64000 svc_default_cir=32000 svc_default_bc=32000 svc_default_be=0 \
         svc_default_fmif=1600 svc_default_ftp=8 svc_default_fdp=4 svc_default_svc_class=1

# ======================================================================
# DEFINISI ANTARMUKA
# ======================================================================
# Mendefinisikan antarmuka-antarmuka yang diaktifkan oleh instance
# VFRS ini.
#
# Format: port <name> <transport> [transport-args...]
# Nama antarmuka harus menggunakan format uni<X>/<Y> atau nni<X>/<Y>.
#
# Mode transport frame yang didukung:
#  - Named pipe
#    port <name> pipe-client <nama_pipa> [dlcibit=<10|23>]
#    port <name> pipe-server <nama_pipa> [dlcibit=<10|23>]
#  - Antarmuka serial (fisik/virtual)
#    port <name> serial      <device> <baudrate> [dlcibit=<10|23>]
#  - TCP raw socket
#    port <name> tcp         <local_addr> <local_port> <remote_addr> <remote_port> [dlcibit=<10|23>]
#    port <name> tcp-client  <remote_addr> <remote_port> [dlcibit=<10|23>] 
#    port <name> tcp-server  [<bind_addr>] <port> [dlcibit=<10|23>]
#  - UDP raw socket
#    port <name> udp         <local_addr> <local_port> <remote_addr> <remote_port> [dlcibit=<10|23>]
#    port <name> udp-client  <remote_addr> <remote_port> [dlcibit=<10|23>]
#    port <name> udp-server  [<bind_addr>] <port> [dlcibit=<10|23>]
#  - L2TPv3 (draft/roadmap: NNI antar VFRS dan UNI dengan DTE VFRNS)
#    port <name> l2tpv3-fr   [<local_addr>] <remote_addr> <base_vcid> [dlcibit=<10|23>]
#    port <name> l2tpv3-hdlc [<local_addr>] <remote_addr> <vcid> [dlcibit=<10|23>]
#
# Untuk tipe named pipe, diharuskan salah satu ujung sebagai server (pembuat pipa) dan
# ujung yang lain sebagai client (pengguna pipa).
# Untuk tipe soket TCP/UDP:
#  - `tcp`/`udp`: mode berpasangan simetris (symmetric 4-tuple paired socket)
#  - `tcp-client`/`udp-client`: mode client, VFRS membuat koneksi dari port lokal ke server remote
#  - `tcp-server`/`udp-server`: mode server, VFRS menerima koneksi di port lokal yang ditentukan
# Untuk tipe L2TPv3, antarmuka ini berada dalam tahap draft/roadmap dan mendukung validasi
# konfigurasi awal untuk pseudowire RFC 4349 (HDLC mode) dan RFC 4591 (FR mode).
#
# Format pengalamatan (untuk soket TCP/UDP dan L2TPv3):
#   - IPv4: "127.0.0.1", "0.0.0.0" (bind all interfaces)
#   - Hostname: "localhost", "router1.example.com"
#
# Konfigurasi Access rate (AR) (X.36 §8.2.1) secara otomatis:
#   Untuk antarmuka tipe serial, access rate diturunkan (derived) secara otomatis
#   dari baud rate serial jika tidak ditentukan secara eksplisit.
#
# Panjang DLCI:
#   Default: 10-bit (0-1023).
#   Opsi 23-bit: dlcibit=23 (0-8388607 per X.36).

# Konfigurasi 4 endpoint soket UDP ke loopback untuk uji coba,
# terhubung sebagai antarmuka UNI dalam satu kelompok yang sama:
#    portid    transport lhost     lport rhost     rport  opsi
port uni0/0    udp       127.0.0.1 10000 127.0.0.1 10001  dlcibit=23
port uni0/1    udp       127.0.0.1 10002 127.0.0.1 10003  dlcibit=23
port uni0/2    udp       127.0.0.1 10004 127.0.0.1 10005
port uni0/3    udp       127.0.0.1 10006 127.0.0.1 10007

# Contoh konfigurasi UDP Client dan Server:
# port uni1/0  udp-client 127.0.0.1 10020
# port uni1/1  udp-server 0.0.0.0 10020
# port uni1/2  udp-server 10022

# Contoh konfigurasi TCP Client dan Server:
# port uni1/3  tcp-server 0.0.0.0 10010
# port uni1/4  tcp-client 127.0.0.1 10010

# Contoh antarmuka Named pipe (Windows / Linux):
# port uni2/0  pipe-server \\.\pipe\vfr_uni20
# port uni2/1  pipe-client \\.\pipe\vfr_uni20

# Contoh antarmuka Serial (Access rate otomatis = baudrate):
# port uni3/0  serial COM3 115200
# port uni3/1  serial /dev/ttyUSB0 115200

# Contoh antarmuka NNI (Network-to-Network Interface):
# port nni0/0  udp 127.0.0.1 20000 127.0.0.1 20001

# Contoh draft L2TPv3 (RFC 4591 / RFC 4349):
# port nni0/1  l2tpv3-fr   0.0.0.0 192.168.1.2 100
# port nni0/2  l2tpv3-hdlc 0.0.0.0 192.168.1.3 200

# ======================================================================
# DEFINISI PVC (Permanent Virtual Circuits)
# ======================================================================
# Membuat pemetaan DLCI dua arah (dua entri tabel switching).
# Koneksi PVC dibuat secara permanen dan menghubungkan antara 2 DLCI
# tertentu dari 2 antarmuka yang berbeda.
#
# Format: pvc <port1> <dlci1> <port2> <dlci2> [cir=<bps>] [bc=<bits>]
#             [be=<bits>] [ftp=<0-15>] [fdp=<0-7>] [srvcls=<0-3>]
# Parameter layanan opsional (X.36 §7.4-7.6, §8.2):
#   cir         Committed Information Rate, dalam bps (traffic policing)
#   bc          Committed burst size Bc, dalam bit (Tc = Bc/CIR)
#   be          Excess burst size Be, dalam bit
#   ftp         Frame Transfer Priority, 0 sampai 15
#               (lebih tinggi = waktu penundaan yang lebih baik)
#   fdp         Frame Discard Priority, 0 sampai 7
#               (lebih tinggi = dibuang lebih terakhir)
#   srvcls      Service Class (per X.36 Table 7-1), 0 sampai 3
#
# Pengaturan lalu lintas: token bucket tiga lapis memberlakukan CIR/Bc/Be.
# Lalu-lintas Committed (dalam Bc): diteruskan apa adanya
# Lalu-lintas berlebih (dalam Be): bit DE disetel (X.36 §8.2)
# Di luar Bc+Be: seperti lalu-lintas berlebih, tetapi akan lebih lambat
#                diproses dan dapat langsung dibuang saat antarmuka padat.

# Koneksi PVC lokal antara uni0/0 dan uni0/1:
pvc uni0/0 100 uni0/1 200
pvc uni0/0 101 uni0/1 201

# Koneksi PVC lokal antara uni0/0 dan uni0/2:
pvc uni0/0 102 uni0/2 300

# Contoh koneksi PVC dengan pengaturan QoS & traffic policing:
# pvc uni0/0 103 uni0/1 203 cir=64000 bc=64000 be=32000 ftp=8 fdp=4 srvcls=1

# Contoh koneksi PVC lintas NNI:
# pvc uni0/0 110 nni0/0 210

# ======================================================================
# KONFIGURASI LMI (Q.933 Annex A / T1.617 Annex D / Cisco LMI)
# ======================================================================
# Mengaktifkan dan mengatur protokol persinyalan LMI
# (Local Management Interface) untuk pengelolaan status koneksi PVC.
#
# Format: lmi <port_name> [q933a|ansi|cisco|none]
#                         [t392=<s>] [n392=<n>] [n393=<n>]
#                         [async=<true|false>]
# Tipe protokol LMI yang didukung:
#   q933a   ITU-T Q.933 Annex A / X.36 & X.76 Klausa 11 (default)
#           (termasuk dukungan X.36 Annex G / X.76 Annex C Segmented Full Status)
#   ansi    ANSI T1.617 Annex D
#   cisco   Vendor Gang of Four LMI (DLCI 1023)
#   none    LMI dinonaktifkan secara eksplisit pada antarmuka ini
#
# Parameter DCE LMI:
#   n392   Error threshold, 1-10 (default: 3)
#   n393   Monitored events window, 1-10 (default: 4)
#   t392   DCE polling verification timer, 5-30 seconds (default: 15s)

lmi uni0/0 q933a
lmi uni0/1 q933a
lmi uni0/2 q933a
lmi uni0/3 q933a

# Contoh konfigurasi LMI dengan timer custom:
# lmi uni0/0 q933a t392=20 n392=3 n393=4

# ======================================================================
# KONFIGURASI LMI DUA ARAH (Bidirectional LMI / DTE Polling)
# ======================================================================
# Mengaktifkan fungsionalitas polling sisi DTE pada suatu antarmuka.
#
# Format: lmi_dte <port_name> [t391=<s>] [n391=<n>] [n392=<n>] [n393=<n>]
# Parameter DTE LMI:
#   n391  Full status polling counter, 1-255 (default: 6)
#   n392  Error threshold, 1-10 (default: 3)
#   n393  Monitored events window, 1-10 (default: 4)
#   t391  DTE polling interval, 5-30 seconds (default: 10s)
#
# Catatan NNI: Pada antarmuka NNI, lmi_dte otomatis diaktifkan per X.76 §11.4.

# Contoh mengaktifkan LMI DTE polling pada port UNI:
# lmi_dte uni0/0 t391=10 n391=6

# ======================================================================
# KONFIGURASI PARAMETER LAPF CUSTOM (Q.922 §5.9)
# ======================================================================
# Mengubah nilai parameter LAPF default pada suatu antarmuka.
#
# Format: lapf <port_name> [k=<n>] [n200=<n>] [n201=<n>] [t200=<s>] [t203=<s>]
# Parameter:
#   k=<n>      Window size (default: 8)
#   n200=<n>   Max retransmissions (default: 3)
#   n201=<n>   Max I-frame info field, octets (default: 260)
#   t200=<s>   Retransmission timer, seconds (default: 2s)
#   t203=<s>   Idle timer, seconds (default: 30s)

# lapf uni0/0 t200=1 n200=5
# lapf uni0/2 k=3 n201=1598

# ======================================================================
# DEFINISI SVC (Switched Virtual Circuits)
# ======================================================================
# Mengaktifkan fungsionalitas layanan dan persinyalan SVC di suatu antarmuka.
# UNI menggunakan ITU-T X.36 Klausa 10 / Q.933.
# NNI menggunakan ITU-T X.76 Klausa 10.
#
# Format: svc_int  <port_name> [dlci_low=<n>] [dlci_high=<n>]
#                  [t303=<s>] [t305=<s>] [t308=<s>] [t310=<s>] [t301=<s>]
#                  [t316=<s>] [t317=<s>] [t322=<s>]
#                  [default_cir=<bps>] [default_bc=<bits>] [default_be=<bits>]
#                  [default_fmif=<octets>] [default_ftp=<0-15>] [default_fdp=<0-7>]
#                  [default_svc_class=<0-3>]
#
# Parameter:
#   dlci_low    Nilai DLCI terendah dalam pool alokasi SVC (default: 512)
#   dlci_high   Nilai DLCI tertinggi dalam pool alokasi SVC (default: 991)

# Contoh inisialisasi SVC signaling pada port UNI:
# svc_int uni0/0 dlci_low=512 dlci_high=991 default_cir=64000 default_bc=64000 default_be=0
# svc_int uni0/1 dlci_low=512 dlci_high=991
# svc_int nni0/0 dlci_low=512 dlci_high=991

# ======================================================================
# KONFIGURASI PENOMORAN SVC (svc_addr)
# ======================================================================
# Mengatur pengalokasian nomor pelanggan untuk layanan SVC pada antarmuka UNI.
#
# Format:
#  1. Mode Alokasi Manual (X.121 atau E.164 dengan dukungan makro mnemonik):
#     svc_addr <port_name> manual [x121|e164] <primary_number> [alias=x121|e164,<alias_number>]
#
#  2. Mode Alokasi Semi-Otomatis Prefiks (DNIC + SGC + SIC otomatis):
#     svc_addr <port_name> autoprefix <primary_sub_number> [alias=x121|e164,<alias_number>]
#
#  3. Format Ringkas Backward-Compatible:
#     svc_addr <port_name> [x121|e164] <primary_number> [alias=...]
#
# Mnemonik X.121 yang didukung:
#   D   = Kode DNIC switch
#   G   = Kode SGC switch (zero-padded ke sgclen)
#   E   = Kode SIC switch (zero-padded ke siclen)
#
# Pada mode autoprefix, panjang <primary_sub_number> dibatasi maksimal hingga
# nilai `subnumlen` pada swconfig (default: 4 digit).

# Contoh registrasi penomoran SVC:
# svc_addr uni0/0 manual x121 DGE0001 alias=e164,628110001
# svc_addr uni0/1 manual x121 510401010002
# svc_addr uni0/2 autoprefix 0003 alias=e164,628110003
# svc_addr uni0/3 autoprefix 0004

# ======================================================================
# KONFIGURASI PERUTEAN PERSINYALAN SVC (svc_route)
# ======================================================================
# Mengatur perutean panggilan keluar SVC ke antarmuka NNI.
#
# Format:
#  1. Perutean Struktural X.121:
#     svc_route <port_name> x121 dnic=<dst_dnic> [sgc=<dst_sgc>] [sic=<dst_sic>]
#
#  2. Perutean Longest Prefix Match:
#     svc_route <port_name> [x121|e164] prefix=<prefix>
#
#  3. Format Ringkas:
#     svc_route <prefix> <port_name>
#
# Pada perutean struktural, jika nilai `sgc` atau `sic` lebih pendek dari
# `sgclen` atau `siclen`, maka secara otomatis dilakukan zero-padding.

# Contoh rute SVC:
# svc_route nni0/0 x121 dnic=5105 sgc=01 sic=01
# svc_route nni0/0 x121 prefix=5105
# svc_route nni0/0 e164 prefix=62

# ======================================================================
# KONFIGURASI DETEKSI DAN MANAJEMEN KEMACETAN (X.36 §12)
# ======================================================================
# Mengatur deteksi kemacetan berbasis rate frame dan threshold error write,
# serta mengaktifkan penandaan FECN/BECN, pembuangan frame DE, dan CLLM.
#
# Format: congestion <port_name> rate=<fps> [clear=<fps>]
#              [threshold=<n>] [cllm=on|off] [access_rate=<bps>]

# congestion uni0/0 rate=10000 clear=5000 cllm=on
# congestion uni0/1 rate=5000 threshold=3

# ======================================================================
# KONFIGURASI CLLM (X.36 Annex C)
# ======================================================================
# Mengatur pengiriman pesan notifikasi kemacetan CLLM pada DLCI 1007.
#
# Format: cllm <port_name> [tx=<s>]
# Parameter:
#   tx   interval retransmisi CLLM selama kemacetan, 5-30s (default: 10s)

cllm uni0/0 tx=10
cllm uni0/1

# ======================================================================
# MULTICAST GROUPS (Frame Replication)
# ======================================================================
# Format:
#   mcast <group_name> <source_port> <source_dlci> [oneway|twoway|nway]
#   mcast_member <group_name> <member_port> <member_dlci>
#
# Mode:
#   oneway  Source -> members only (point-to-multipoint)
#   twoway  Source <-> members (bidirectional)
#   nway    Any -> all others (multipoint-to-multipoint, full mesh)

# Contoh One-Way Broadcast:
# mcast broadcast1 uni0/0 1019 oneway
# mcast_member broadcast1 uni0/0 1020
# mcast_member broadcast1 uni0/1 1021

# Contoh N-Way Full Mesh:
# mcast mesh1 uni0/0 500 nway
# mcast_member mesh1 uni0/1 501
# mcast_member mesh1 uni0/1 502

# ======================================================================
# PACKET CAPTURE (PCAP)
# ======================================================================
# Format: capture <port_name|all> <filename> [svc=iframe|ui]
#
# Menangkap frame Frame Relay dalam format standar PCAP (DLT 107 - LINKTYPE_FRELAY).

# Contoh capture per-port:
# capture uni0/0 uni00_trace.pcap
# capture nni0/0 nni00_trace.pcap

# Contoh global capture (semua antarmuka):
# capture all switch_trace.pcap
